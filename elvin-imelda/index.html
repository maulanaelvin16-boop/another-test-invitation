
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Elvin &amp; Imelda — Wedding Invitation</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>
<body>
  <iframe
    id="invitation"
    title="Undangan Pernikahan Elvin dan Imelda">
  </iframe>

  <script>
    const params = window.location.search;
    const hash = window.location.hash;

    document.getElementById("invitation").src =
      "https://melvininvitation.my.id/" + params + hash;
  </script>
</body>
</html>
